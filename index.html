<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Você realmente quer continuar?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at center, #260000 0%, #080000 45%, #000 100%);

            color: #eee;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Efeito de ruído */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );

            pointer-events: none;
        }

        .caixa {
            width: min(90%, 550px);

            padding: 45px 30px;

            text-align: center;

            background: rgba(10, 0, 0, 0.85);

            border: 1px solid #650000;
            border-radius: 15px;

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.15),
                inset 0 0 30px rgba(255, 0, 0, 0.05);
        }

        .icone {
            font-size: 70px;

            animation: pulsar 1.5s infinite;
        }

        @keyframes pulsar {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        h1 {
            color: #ff2222;
            font-size: 30px;

            text-shadow:
                0 0 10px #ff0000;
        }

        p {
            color: #aaa;
            font-size: 17px;
            line-height: 1.6;
        }

        .aviso {
            margin: 25px 0;

            color: #ff4444;
            font-weight: bold;
        }

        .botao {
            display: inline-block;

            padding: 15px 28px;

            background: #8b0000;
            color: white;

            text-decoration: none;

            border: 1px solid #ff3333;
            border-radius: 8px;

            font-weight: bold;
            font-size: 17px;

            box-shadow:
                0 0 15px rgba(255,0,0,0.3);

            transition: 0.2s;
        }

        .botao:hover {
            background: #c00000;

            box-shadow:
                0 0 30px rgba(255,0,0,0.7);

            transform: scale(1.05);
        }

        .rodape {
            margin-top: 30px;

            font-size: 12px;
            color: #555;
        }

        @media (max-width: 600px) {

            .caixa {
                padding: 35px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .icone {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="caixa">

        <div class="icone">☠️</div>

        <h1>VOCÊ TEM CERTEZA?</h1>

        <p>
            Existe algo esperando por você.
        </p>

        <p class="aviso">
            ⚠️ Depois de clicar, não diga que eu não avisei.
        </p>

        <a
            class="botao"
            href="https://www.youtube.com/watch?v=MTIrkMixUxA"
            target="_blank"
            rel="noopener noreferrer">

            ☠️ EU ACEITO O RISCO
        </a>

        <div class="rodape">
            BKP Corporation • Sistema experimental
        </div>

    </div>

</body>

</html>
